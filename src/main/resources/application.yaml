spring:
  output.ansi.enabled: ALWAYS
  application:
    name: DareAndTruth
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dare_and_truth}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PW:postgresql}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: 8080

fe-server:
  url: ${FE_URL:http://localhost:3000}

openapi:
  service:
    api-docs: DareAndTruth-service
    title: Dare&Truth API Documentation
    version: v0.0.1
    server: http://localhost:8080

app:
  jwt:
    secret: ${JWT_SECRET:5gZHYsLGeUB7TvtT9AbxlgaNXyUaykNzDgdK00yX5SPDXrNeCGBYNrngUym3ykRn}
    expiration-ms: ${JWT_EXPIRATION:86400000}